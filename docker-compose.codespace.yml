version: '3.8'

services:
  # Development container for Codespaces
  codespace-dev:
    image: mcr.microsoft.com/devcontainers/typescript-node:18
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    network_mode: service:app
    environment:
      - NODE_ENV=development
      - CODESPACE_MODE=true

  # Main application (web version, not Electron)
  app:
    build:
      context: .
      dockerfile: Dockerfile.codespace
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=ws://localhost:3004
    depends_on:
      - api_server
      - data_bus_manager
    command: npm run dev

  # Trading API Server
  api_server:
    build:
      context: ./docker/api-server
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://trader:trader123@database:5432/trading_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - database
      - redis
    volumes:
      - ./docker/api-server:/app
      - /app/node_modules

  # Backtesting Server
  backtesting_server:
    build:
      context: ./docker/backtesting-server
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://trader:trader123@database:5432/trading_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - database
      - redis
    volumes:
      - ./docker/backtesting-server:/app
      - /app/node_modules

  # Options Data Service
  options_data_service:
    build:
      context: ./docker/options-data-service
      dockerfile: Dockerfile.dev
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://trader:trader123@database:5432/trading_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - database
      - redis
    volumes:
      - ./docker/options-data-service:/app
      - /app/node_modules

  # Data Bus Manager
  data_bus_manager:
    build:
      context: ./docker/data-bus-manager
      dockerfile: Dockerfile.dev
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./docker/data-bus-manager:/app
      - /app/node_modules

  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: trading-network